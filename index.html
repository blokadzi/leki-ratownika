<title>Leki ratownika — kurs 10 × 5</title>
<style>
  :root {
    --tlo:#0B1120; --panel:#16213B; --panel2:#1B2842; --linia:#243352;
    --tekst:#E8EEF7; --przygas:#94A8C6; --akcent:#5EEAD4; --kol:#5EEAD4;
    --ok:#34D399; --zle:#F87171; --zolty:#FCD34D;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--tlo); color:var(--tekst); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font:inherit; color:inherit; cursor:pointer; }
  h1,h2,h3 { line-height:1.2; margin:0; text-wrap:balance; }
  .wrap { max-width:1020px; margin:0 auto; padding:0 16px 80px; }

  /* pasek górny */
  .gora { position:sticky; top:0; z-index:20; background:rgba(11,17,32,.93); backdrop-filter:blur(8px); border-bottom:1px solid var(--linia); }
  .gora-in { max-width:1020px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; min-height:54px; }
  .gora-t { font-weight:800; font-size:15.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wstecz { background:var(--panel); border:1px solid var(--linia); border-radius:10px; padding:7px 13px; font-size:14px; font-weight:700; white-space:nowrap; }
  .wstecz:hover { border-color:var(--akcent); }

  /* przyciski, chipy */
  .btn { background:var(--akcent); color:#06121f; border:0; border-radius:12px; padding:12px 20px; font-weight:800; font-size:15px; }
  .btn:hover { filter:brightness(1.08); }
  .btn.sec { background:var(--panel); color:var(--tekst); border:1px solid var(--linia); }
  .btn.sec:hover { border-color:var(--akcent); filter:none; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .rzad { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:transparent; border:1px solid var(--linia); border-radius:999px; padding:7px 14px; font-size:13.5px; font-weight:700; color:var(--przygas); }
  .chip.on { background:var(--panel2); border-color:var(--akcent); color:var(--tekst); }
  .panel { background:var(--panel); border:1px solid var(--linia); border-radius:16px; padding:18px; }
  .mini { font-size:12.5px; color:var(--przygas); }
  .et { font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--przygas); }

  /* HUB */
  .hero { padding:28px 0 18px; }
  .hero h1 { font-size:clamp(26px,5vw,38px); font-weight:900; letter-spacing:-.02em; }
  .hero h1 em { font-style:normal; color:var(--akcent); }
  .hero p { color:var(--przygas); margin:10px 0 0; max-width:62ch; }
  .staty { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 8px; }
  .stat { background:var(--panel); border:1px solid var(--linia); border-radius:14px; padding:12px 14px; }
  .stat b { display:block; font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; }
  .stat span { font-size:12.5px; color:var(--przygas); }
  .szukaj { width:100%; padding:13px 15px; border-radius:12px; border:1px solid var(--linia); background:var(--panel); color:var(--tekst); font-size:16px; outline:none; margin:10px 0 0; }
  .szukaj:focus { border-color:var(--akcent); }
  .wyniki { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .wynik { background:var(--panel2); border:1px solid var(--linia); border-left:4px solid var(--kol); border-radius:10px; padding:8px 12px; font-size:14px; font-weight:700; text-align:left; }
  .wynik small { display:block; font-weight:500; color:var(--przygas); font-size:12px; }
  .sekc-h { font-size:20px; font-weight:900; margin:30px 0 4px; }
  .sekc-p { color:var(--przygas); margin:0 0 14px; font-size:14.5px; }
  .kafle { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
  .kafel { position:relative; text-align:left; background:var(--panel); border:1px solid var(--linia); border-radius:16px; padding:16px 16px 14px; overflow:hidden; transition:transform .12s, border-color .12s; }
  .kafel::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--kol); }
  .kafel:hover { transform:translateY(-2px); border-color:var(--kol); }
  .kafel-top { display:flex; align-items:center; gap:10px; }
  .kafel-nr { font-size:12px; font-weight:900; color:var(--kol); letter-spacing:.06em; }
  .kafel-ik { font-size:22px; margin-left:auto; }
  .kafel h3 { font-size:17.5px; font-weight:800; margin:4px 0 8px; }
  .kafel-leki { font-size:13px; color:var(--przygas); line-height:1.5; min-height:3em; }
  .pasek { height:7px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:12px; }
  .pasek i { display:block; height:100%; background:var(--kol); border-radius:99px; transition:width .3s; }
  .kafel-stan { display:flex; justify-content:space-between; font-size:12px; color:var(--przygas); margin-top:6px; font-weight:700; }
  .zal { color:var(--ok); }

  /* DZIAŁ */
  .dz-hero { padding:22px 0 6px; }
  .dz-hero .et { color:var(--kol); }
  .dz-hero h2 { font-size:clamp(23px,4.4vw,31px); font-weight:900; margin:4px 0 6px; }
  .dz-hero p { margin:0; color:var(--przygas); max-width:64ch; }
  .taby { display:flex; gap:6px; overflow-x:auto; margin:16px -16px 16px; padding:0 16px 4px; scrollbar-width:none; }
  .taby::-webkit-scrollbar { display:none; }
  .tab { flex:none; background:var(--panel); border:1px solid var(--linia); border-radius:11px; padding:9px 15px; font-weight:800; font-size:14px; color:var(--przygas); }
  .tab.on { background:var(--kol); border-color:var(--kol); color:#06121f; }
  .pigulki { display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; scrollbar-width:none; }
  .pigulki::-webkit-scrollbar { display:none; }
  .pig { flex:none; background:var(--panel); border:1px solid var(--linia); border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:700; color:var(--przygas); }
  .pig.on { border-color:var(--kol); color:var(--tekst); background:var(--panel2); }
  .pig.umiem::after { content:" ✓"; color:var(--ok); }

  .lek { background:var(--panel); border:1px solid var(--linia); border-top:5px solid var(--kol); border-radius:16px; padding:20px; }
  .lek-nag { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; }
  .lek-nag h3 { font-size:clamp(22px,4.6vw,28px); font-weight:900; }
  .lek-lat { font-style:italic; color:var(--przygas); font-size:14.5px; }
  .znaczki { display:flex; flex-wrap:wrap; gap:6px; margin:11px 0 0; }
  .zn { font-size:12px; font-weight:800; padding:4px 10px; border-radius:7px; background:var(--panel2); color:var(--przygas); border:1px solid var(--linia); }
  .zn.kl { color:var(--kol); border-color:color-mix(in srgb,var(--kol) 45%,transparent); }
  .zn.ekg { background:#3b2a05; color:var(--zolty); border-color:#7a5a10; }
  .zn.nowy { background:#06312a; color:var(--akcent); border-color:#0f6b5c; }
  .obraz { margin:16px 0 4px; padding:14px 16px; border-radius:13px; background:color-mix(in srgb,var(--kol) 11%,var(--panel)); border:1px solid color-mix(in srgb,var(--kol) 38%,transparent); font-size:16px; line-height:1.5; }
  .obraz .et { color:var(--kol); display:block; margin-bottom:4px; }
  .siatka2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .blok { background:var(--panel2); border:1px solid var(--linia); border-radius:13px; padding:13px 15px; }
  .blok.caly { grid-column:1/-1; }
  .blok .et { display:block; margin-bottom:6px; }
  .blok ul { margin:0; padding-left:19px; }
  .blok li { margin:3px 0; }
  .blok p { margin:0; }
  .blok.dawka { border-color:color-mix(in srgb,var(--akcent) 45%,transparent); background:rgba(94,234,212,.06); }
  .blok.dawka .et { color:var(--akcent); }
  .blok.uwaga { border-color:#7a5a10; background:rgba(252,211,77,.07); }
  .blok.uwaga .et { color:var(--zolty); }
  .dzieci { margin-top:9px; padding-top:9px; border-top:1px dashed var(--linia); font-size:14.5px; }
  .dzieci b { color:var(--akcent); }
  .lek-stopka { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-top:16px; }

  /* ściąga */
  .os { position:relative; margin:0 0 20px; padding-left:22px; }
  .os::before { content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--linia); }
  .os-k { position:relative; padding:7px 0 9px; }
  .os-k::before { content:""; position:absolute; left:-21px; top:13px; width:12px; height:12px; border-radius:50%; background:var(--kol); box-shadow:0 0 0 4px var(--tlo); }
  .os-k b { display:block; color:var(--kol); font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .tabela-w { overflow-x:auto; border:1px solid var(--linia); border-radius:14px; }
  table { border-collapse:collapse; width:100%; min-width:640px; font-size:14px; }
  th { text-align:left; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--przygas); background:var(--panel2); padding:10px 12px; }
  td { padding:11px 12px; border-top:1px solid var(--linia); vertical-align:top; }
  td:first-child { font-weight:800; white-space:nowrap; }
  td.dw { color:var(--akcent); font-weight:700; }

  /* fiszki */
  .fiszka { min-height:300px; display:flex; flex-direction:column; justify-content:center; text-align:center; background:var(--panel); border:1px solid var(--linia); border-top:5px solid var(--kol); border-radius:18px; padding:26px 20px; cursor:pointer; user-select:none; }
  .fiszka h3 { font-size:clamp(25px,6vw,34px); font-weight:900; }
  .fiszka .podp { color:var(--przygas); margin-top:12px; font-size:14px; }
  .fiszka.tyl { text-align:left; justify-content:flex-start; cursor:default; }
  .fiszka.tyl h3 { font-size:21px; margin-bottom:10px; }
  .f-w { margin:7px 0; }
  .f-w .et { display:block; }
  .f-w.dw { color:var(--akcent); font-weight:700; }

  /* dopasuj */
  .dop { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:10px; }
  .dop-kol { display:flex; flex-direction:column; gap:8px; }
  .dop-b { text-align:left; background:var(--panel); border:1px solid var(--linia); border-radius:12px; padding:11px 13px; font-size:14px; min-height:54px; line-height:1.35; }
  .dop-b.lewy { font-weight:800; font-size:15px; }
  .dop-b.wyb { border-color:var(--kol); background:var(--panel2); box-shadow:0 0 0 2px color-mix(in srgb,var(--kol) 45%,transparent); }
  .dop-b.ok { border-color:var(--ok); background:rgba(52,211,153,.12); color:#B7F5DC; cursor:default; }
  .dop-b.zle { border-color:var(--zle); background:rgba(248,113,113,.14); animation:trz .3s; }
  @keyframes trz { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* test */
  .t-gora { display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--przygas); margin:18px 0 8px; }
  .t-pasek { height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-bottom:14px; }
  .t-pasek i { display:block; height:100%; background:var(--akcent); transition:width .25s; }
  .t-typ { display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:7px; background:var(--panel2); color:var(--kol); border:1px solid var(--linia); }
  .t-q { font-size:clamp(18px,3.6vw,21px); font-weight:800; margin:12px 0 4px; line-height:1.35; }
  .t-cyt { margin:10px 0 2px; padding:12px 15px; border-left:4px solid var(--kol); background:var(--panel2); border-radius:0 12px 12px 0; font-size:15.5px; }
  .t-odp { display:flex; flex-direction:column; gap:9px; margin-top:16px; }
  .t-odp button { display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--panel2); border:1px solid var(--linia); border-radius:12px; padding:12px 14px; font-size:15px; line-height:1.4; }
  .t-odp button:not(:disabled):hover { border-color:var(--akcent); }
  .t-odp button:disabled { cursor:default; }
  .lit { flex:none; width:26px; height:26px; border-radius:8px; background:var(--panel); border:1px solid var(--linia); display:grid; place-items:center; font-size:12.5px; font-weight:900; color:var(--przygas); }
  .t-odp .dobra { border-color:var(--ok); background:rgba(52,211,153,.13); }
  .t-odp .dobra .lit { background:var(--ok); color:#05291d; border-color:var(--ok); }
  .t-odp .zla { border-color:var(--zle); background:rgba(248,113,113,.12); }
  .t-odp .zla .lit { background:var(--zle); color:#350909; border-color:var(--zle); }
  .t-fb { margin-top:14px; padding:14px 16px; border-radius:13px; border:1px solid var(--linia); background:var(--panel2); }
  .t-fb.ok { border-color:rgba(52,211,153,.5); }
  .t-fb.no { border-color:rgba(248,113,113,.5); }
  .t-fb h4 { margin:0 0 6px; font-size:15.5px; }
  .t-fb.ok h4 { color:var(--ok); } .t-fb.no h4 { color:var(--zle); }
  .t-fb p { margin:5px 0 0; font-size:14.5px; }
  .t-fb .karta { margin-top:10px; padding-top:10px; border-top:1px dashed var(--linia); font-size:13.5px; color:var(--przygas); }
  .t-fb .karta b { color:var(--tekst); }
  .wynik-k { text-align:center; padding:30px 18px; }
  .wynik-k .proc { font-size:64px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
  .wynik-k .wer { font-size:18px; font-weight:800; margin-top:8px; }
  .rozb { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin:14px 0; }
  .rozb div { background:var(--panel2); border:1px solid var(--linia); border-radius:10px; padding:9px 12px; font-size:13.5px; display:flex; justify-content:space-between; gap:8px; }

{ n:"AF", k:"Skrót", o:"Migotanie przedsionków (atrial fibrillation) — chaotyczna czynność przedsionków i całkowicie niemiarowy rytm komór.", t:["AF","migotanie przedsionków","migotaniu przedsionków","migotania przedsionków","Migotanie przedsionków"] },
{ n:"WPW i preekscytacja", k:"Rytm i EKG", o:"Zespół Wolffa-Parkinsona-White'a: dodatkowa droga przewodzenia omija węzeł AV i pobudza komory przedwcześnie. Leki blokujące sam węzeł AV mogą wtedy niebezpiecznie przyspieszyć rytm komór.", t:["WPW","preekscytacj*"] },
{ n:"Manewry wagalne", k:"Zabieg", o:"Sposoby pobudzenia nerwu błędnego, które zwalniają przewodzenie w węźle AV i mogą przerwać częstoskurcz: próba Valsalvy (parcie przy zamkniętej głośni, najlepiej z uniesieniem nóg), masaż zatoki szyjnej.", t:["manewry wagalne","manewrach wagalnych","Manewry wagalne","Próba Valsalvy","próba Valsalvy"] },
{ n:"Nerw błędny", k:"Fizjologia", o:"Główny nerw układu przywspółczulnego. Zwalnia serce, zwęża oskrzela, pobudza wydzielanie i perystaltykę; działa przez acetylocholinę.", t:["nerwu błędnego","nerw błędny"] },

// ── OZW, krzepnięcie ──
{ n:"OZW", k:"Skrót", o:"Ostry zespół wieńcowy — nagłe niedokrwienie serca przez skrzeplinę na pękniętej blaszce miażdżycowej: zawał z uniesieniem ST (STEMI), bez uniesienia ST (NSTEMI) albo niestabilna dławica.", t:["OZW"] },
{ n:"STEMI", k:"Skrót", o:"Zawał serca z uniesieniem odcinka ST — tętnica wieńcowa jest całkowicie zamknięta i trzeba ją jak najszybciej udrożnić.", t:["STEMI"] },
{ n:"PCI", k:"Skrót", o:"Przezskórna interwencja wieńcowa (angioplastyka): udrożnienie tętnicy wieńcowej balonem i stentem przez cewnik. „Pierwotna” = wykonana od razu jako leczenie zawału.", t:["PCI","angioplasty*"] },
{ n:"Hemodynamika", k:"Fizjologia", o:"Krążenie krwi opisane ciśnieniem, rzutem serca i przepływem. Pacjent stabilny hemodynamicznie ma wydolne krążenie. Pracownia hemodynamiki to sala, w której wykonuje się koronarografię i PCI.", t:["hemodynami*"] },
{ n:"Dławica piersiowa", k:"Stan kliniczny", o:"Ból w klatce piersiowej z niedokrwienia serca. Stabilna — przewidywalna, przy wysiłku; niestabilna — nowa, narastająca lub spoczynkowa, zaliczana do OZW.", t:["dławic*","dławicow*"] },
{ n:"Receptor P2Y12 i ADP", k:"Receptor", o:"ADP to cząsteczka, którą pobudzone płytki krwi wzywają kolejne płytki. Robi to przez receptor P2Y12 — zablokowanie go przerywa narastanie skrzepliny.", l:"Blokują go klopidogrel, tikagrelor i prasugrel.", t:["P2Y12","ADP"] },
{ n:"Tromboksan A₂", k:"Mechanizm", o:"Substancja wytwarzana przez płytki krwi z udziałem COX-1; silnie nasila ich zlepianie i obkurcza naczynia.", l:"Jego powstawanie blokuje ASA.", t:["tromboksan*"] },
{ n:"Lek przeciwpłytkowy", k:"Farmakologia", o:"Hamuje zlepianie się płytek krwi, czyli pierwszy etap powstawania skrzepliny w tętnicy. Podwójna terapia przeciwpłytkowa = dwa takie leki o różnych punktach uchwytu.", t:["przeciwpłytkow*"] },
{ n:"Antykoagulant", k:"Farmakologia", o:"Lek przeciwkrzepliwy: hamuje osoczowe czynniki krzepnięcia (a nie płytki). Istniejącego skrzepu nie rozpuszcza — nie pozwala mu rosnąć.", l:"Na liście: heparyna.", t:["antykoagulan*","przeciwkrzepliw*"] },
{ n:"Antytrombina", k:"Mechanizm", o:"Naturalny hamulec krzepnięcia we krwi: unieczynnia trombinę i czynnik Xa.", l:"Heparyna przyspiesza jej działanie tysiąckrotnie.", t:["antytrombin*"] },
{ n:"Fibrynoliza i plazmina", k:"Mechanizm", o:"Fibrynoliza to naturalne rozpuszczanie skrzepu. Wykonuje je enzym plazmina, który tnie fibrynę — białkową sieć skrzepu. Lek przeciwfibrynolityczny ten proces hamuje.", l:"Kwas traneksamowy blokuje plazminę.", t:["fibrynoli*","przeciwfibrynolityczn*","plazmin*","fibryn*"] },
{ n:"HIT", k:"Skrót", o:"Małopłytkowość poheparynowa (heparin-induced thrombocytopenia): reakcja immunologiczna, w której spada liczba płytek, a paradoksalnie rośnie ryzyko zakrzepów.", t:["HIT"] },
{ n:"DIC", k:"Skrót", o:"Zespół rozsianego wykrzepiania wewnątrznaczyniowego: krzepnięcie uruchamia się w całym krążeniu, zużywa płytki i czynniki krzepnięcia, po czym pacjent krwawi.", t:["DIC"] },
{ n:"Skaza krwotoczna", k:"Stan kliniczny", o:"Wrodzona lub nabyta skłonność do krwawień — z powodu płytek, czynników krzepnięcia albo naczyń.", t:["skaza krwotoczna","Skaza krwotoczna"] },
{ n:"Małopłytkowość", k:"Stan kliniczny", o:"Zbyt mała liczba płytek krwi (poniżej 150 tys./µl), a przez to skłonność do krwawień.", t:["małopłytkowoś*"] },
{ n:"TIA", k:"Skrót", o:"Przemijający atak niedokrwienny (transient ischemic attack): objawy udaru, które ustępują samoistnie, zwykle w ciągu godziny. Zapowiedź pełnego udaru.", t:["TIA"] },
{ n:"Zatorowość płucna", k:"Stan kliniczny", o:"Zamknięcie tętnicy płucnej przez skrzeplinę, najczęściej z żył głębokich nóg: nagła duszność, ból w klatce, tachykardia, w ciężkiej postaci wstrząs.", t:["zatorowoś*"] },
{ n:"CRASH-2", k:"Badanie", o:"Badanie kliniczne na ponad 20 tys. chorych po urazach, które wykazało, że wczesne podanie leku przeciwfibrynolitycznego zmniejsza śmiertelność z powodu krwotoku.", t:["CRASH-2"] },

// ── Receptory i mechanizmy ──
{ n:"Agonista", k:"Farmakologia", o:"Lek, który przyłącza się do receptora i go pobudza — naśladuje naturalny przekaźnik.", t:["agonist*"] },
{ n:"Antagonista", k:"Farmakologia", o:"Lek, który zajmuje receptor, ale go nie pobudza — blokuje dostęp naturalnemu przekaźnikowi lub innemu lekowi. Kompetycyjny (konkurencyjny) = walczy o to samo miejsce, więc większa dawka przeciwnika może go wyprzeć.", t:["antagonist*","kompetycyjn*","konkurencyjn*"] },
{ n:"Katecholamina", k:"Farmakologia", o:"Przekaźnik i hormon układu współczulnego (adrenalina, noradrenalina, dopamina) oraz leki o tej samej budowie. Działają przez receptory α i β, szybko i krótko.", t:["katecholamin*"] },
{ n:"Receptor α1", k:"Receptor", o:"Receptor adrenergiczny w mięśniówce naczyń. Pobudzenie = skurcz naczyń, wzrost oporu i ciśnienia. Blokada = rozszerzenie naczyń.", l:"Pobudzają: adrenalina, noradrenalina. Blokuje: urapidyl.", t:["α1"] },
{ n:"Receptor β1", k:"Receptor", o:"Receptor adrenergiczny w sercu. Pobudzenie = szybsza czynność, silniejszy skurcz, szybsze przewodzenie. Blokada = odwrotnie.", l:"Pobudza: adrenalina. Blokuje: metoprolol.", t:["β1"] },
{ n:"Receptor β2", k:"Receptor", o:"Receptor adrenergiczny w oskrzelach i naczyniach mięśni. Pobudzenie = rozkurcz oskrzeli; przy okazji potas przechodzi z krwi do komórek.", l:"Pobudzają: salbutamol, adrenalina.", t:["β2"] },
{ n:"β-bloker", k:"Farmakologia", o:"Lek blokujący receptory β (β-adrenolityk). Kardioselektywny = w zwykłych dawkach blokuje głównie β1 w sercu i oszczędza β2 w oskrzelach.", l:"Na liście: metoprolol. Odtrutka w zatruciu: glukagon.", t:["β-bloker*","β-adrenolity*","kardioselektywn*"] },
{ n:"Receptory muskarynowe (M)", k:"Receptor", o:"Receptory dla acetylocholiny w sercu, oskrzelach, gruczołach i mięśniach gładkich — przez nie działa nerw błędny. Pobudzenie zwalnia serce, zwęża oskrzela, nasila wydzielanie.", l:"Blokuje je atropina.", t:["muskarynow*"] },
{ n:"Cholinolityk", k:"Farmakologia", o:"Lek blokujący receptory muskarynowe. Skutki cholinolityczne: przyspieszenie serca, suchość w ustach, szerokie źrenice, zatrzymanie moczu, zaparcia, sucha gorąca skóra.", t:["cholinolit*"] },
{ n:"Acetylocholina", k:"Fizjologia", o:"Przekaźnik układu przywspółczulnego i płytki nerwowo-mięśniowej.", t:["acetylocholin*"] },
{ n:"Receptory opioidowe (µ)", k:"Receptor", o:"Receptory w mózgu, rdzeniu i jelitach. Pobudzenie receptora µ daje zniesienie bólu, euforię, ale też depresję oddechową, zwężenie źrenic, zaparcia i uzależnienie.", l:"Pobudzają: morfina, fentanyl. Blokuje: nalokson.", t:["opioidow*"] },
{ n:"Opioid", k:"Farmakologia", o:"Lek działający przez receptory opioidowe — najsilniejsza grupa leków przeciwbólowych.", t:["opioid*"] },
{ n:"GABA i receptor GABA-A", k:"Receptor", o:"GABA to główny przekaźnik hamujący w mózgu. Receptor GABA-A jest kanałem chlorkowym: gdy się otwiera, neuron trudniej pobudzić.", l:"Jego działanie nasilają benzodiazepiny; miejsce benzodiazepinowe blokuje flumazenil.", t:["GABA-A","GABA"] },
{ n:"Benzodiazepina", k:"Farmakologia", o:"Grupa leków nasilających działanie GABA: przeciwdrgawkowe, uspokajające, przeciwlękowe, nasenne, rozluźniające mięśnie. Główne ryzyko to depresja oddechowa i uzależnienie.", l:"Na liście: diazepam, midazolam, klonazepam. Odtrutka: flumazenil.", t:["benzodiazepin*"] },
{ n:"Receptor H1", k:"Receptor", o:"Receptor histaminowy w naczyniach, skórze i oskrzelach. Pobudzenie = rozszerzenie i przeciekanie naczyń (bąble, obrzęk), świąd, skurcz oskrzeli.", l:"Blokują go klemastyna i hydroksyzyna.", t:["H1"] },
{ n:"Histamina", k:"Fizjologia", o:"Mediator reakcji alergicznej uwalniany z mastocytów. Lek przeciwhistaminowy blokuje jej receptory; I generacja przenika do mózgu i usypia.", t:["histamin*","przeciwhistaminow*"] },
{ n:"Mastocyt", k:"Fizjologia", o:"Komórka tuczna — magazyn histaminy w tkankach. Jej degranulacja, czyli gwałtowne wyrzucenie zawartości, uruchamia reakcję alergiczną i anafilaksję.", t:["mastocyt*","degranulacj*"] },
{ n:"Receptor D2", k:"Receptor", o:"Receptor dopaminowy. W strefie wyzwalającej wymioty jego blokada działa przeciwwymiotnie; w układzie pozapiramidowym ta sama blokada daje zaburzenia ruchowe.", l:"Blokują go metoklopramid i tietylperazyna.", t:["D2"] },
{ n:"Receptory serotoninowe (5-HT)", k:"Receptor", o:"Rodzina receptorów dla serotoniny. 5-HT1A w mózgu obniża napięcie współczulne; blokada 5-HT2A działa uspokajająco i przeciwlękowo.", t:["5-HT1A","5-HT2A"] },
{ n:"Receptor NMDA", k:"Receptor", o:"Receptor dla glutaminianu — głównego przekaźnika pobudzającego w mózgu.", t:["NMDA"] },
{ n:"COX (cyklooksygenaza)", k:"Mechanizm", o:"Enzym wytwarzający prostaglandyny i tromboksan. COX-1 działa stale (chroni żołądek, jest w płytkach), COX-2 pojawia się w zapaleniu.", l:"Hamują ją NLPZ: ketoprofen, ibuprofen, ASA; ośrodkowo paracetamol i metamizol.", t:["COX-1","COX-2","COX","cyklooksygenaz*"] },
{ n:"Prostaglandyny", k:"Mechanizm", o:"Miejscowe przekaźniki bólu, zapalenia i gorączki. Te same substancje chronią błonę śluzową żołądka i utrzymują przepływ krwi przez nerki — stąd działania niepożądane leków, które hamują ich wytwarzanie.", t:["prostaglandyn*"] },
{ n:"NLPZ", k:"Skrót", o:"Niesteroidowe leki przeciwzapalne: hamują COX, działają przeciwbólowo, przeciwzapalnie i przeciwgorączkowo. Wspólne ryzyko: wrzody i krwawienie z przewodu pokarmowego, uszkodzenie nerek, napad astmy.", l:"Na liście: ketoprofen, ibuprofen, ASA.", t:["NLPZ"] },
{ n:"Fosfodiesteraza i cAMP", k:"Mechanizm", o:"cAMP to wewnątrzkomórkowy przekaźnik, który rozluźnia mięśnie gładkie. Fosfodiesteraza (PDE) go rozkłada — zahamowanie enzymu podnosi stężenie cAMP i mięsień wiotczeje.", l:"Tak działają drotaweryna i papaweryna.", t:["fosfodiesteraz*","cAMP"] },
{ n:"Inhibitory PDE-5", k:"Farmakologia", o:"Leki na zaburzenia erekcji i nadciśnienie płucne (sildenafil, tadalafil, wardenafil). Nasilają działanie tlenku azotu, więc razem z azotanem dają groźny spadek ciśnienia.", t:["PDE-5","sildenafil*"] },
{ n:"Tlenek azotu (NO)", k:"Mechanizm", o:"Gaz wytwarzany w ścianie naczyń, który rozkurcza ich mięśniówkę.", l:"Uwalniają go azotany: nitrogliceryna i monoazotan izosorbidu.", t:["tlenek azotu","tlenku azotu"] },
{ n:"Azotan", k:"Farmakologia", o:"Lek uwalniający tlenek azotu: rozszerza głównie żyły, zmniejsza dopływ krwi do serca i jego zapotrzebowanie na tlen.", l:"Na liście: nitrogliceryna, monoazotan izosorbidu.", t:["azotan*"] },
{ n:"Obciążenie wstępne", k:"Fizjologia", o:"Ilość krwi, która wraca żyłami i wypełnia serce przed skurczem (preload). Im mniejsze, tym mniej pracy i tlenu potrzebuje serce.", t:["obciążenie wstępne"] },
{ n:"Angiotensyna II i ACE", k:"Mechanizm", o:"Angiotensyna II silnie obkurcza naczynia i pobudza wydzielanie aldosteronu. Powstaje z angiotensyny I dzięki enzymowi konwertującemu (ACE). Inhibitor konwertazy (ACE-I) zatrzymuje ten etap.", l:"Na liście: kaptopryl.", t:["ACE-I","ACE","konwertaz*","angiotensyn*"] },
{ n:"Aldosteron", k:"Fizjologia", o:"Hormon nadnerczy: zatrzymuje w nerkach sód i wodę, a wydala potas. Podnosi ciśnienie.", t:["aldosteron*"] },
{ n:"Bradykinina", k:"Mechanizm", o:"Substancja rozszerzająca naczynia, rozkładana przez ten sam enzym, który wytwarza angiotensynę II. Gdy się gromadzi, wywołuje suchy kaszel i — rzadko — obrzęk naczynioruchowy.", t:["bradykinin*"] },
{ n:"Pętla Henlego", k:"Fizjologia", o:"Odcinek kanalika nerkowego, w którym wraca do krwi ok. jednej czwartej przefiltrowanego sodu. Zablokowanie tego transportu daje najsilniejszą diurezę.", t:["pętli Henlego"] },
{ n:"Diuretyk i diureza", k:"Farmakologia", o:"Diureza to wytwarzanie moczu, diuretyk — lek moczopędny. Pętlowy działa w pętli Henlego; osmotyczny zatrzymuje wodę w świetle kanalika samym ciśnieniem osmotycznym.", l:"Na liście: furosemid (pętlowy), mannitol (osmotyczny).", t:["diurety*","diurez*"] },
{ n:"Glikogen", k:"Fizjologia", o:"Zapasowa forma glukozy zmagazynowana w wątrobie i mięśniach. Zapas wątrobowy wystarcza na kilkanaście godzin; u wyniszczonych i u alkoholików bywa pusty.", t:["glikogen*"] },
{ n:"Glikokortykosteroid (steryd)", k:"Farmakologia", o:"Lek naśladujący kortyzol: silnie przeciwzapalny, przeciwalergiczny i immunosupresyjny. Działa przez zmianę odczytu genów, więc efekt pojawia się po kilku godzinach.", l:"Na liście: hydrokortyzon, deksametazon, budezonid.", t:["glikokortykosteroid*","steryd*"] },
{ n:"Działanie mineralokortykoidowe", k:"Farmakologia", o:"Działanie jak aldosteron: zatrzymywanie sodu i wody, utrata potasu.", t:["mineralokortykoidow*"] },
{ n:"Spazmolityk", k:"Farmakologia", o:"Lek rozkurczający mięśnie gładkie przewodu pokarmowego, dróg żółciowych i moczowych.", t:["spazmoli*","rozkurczow*"] },
{ n:"Prolek", k:"Farmakologia", o:"Lek podawany w postaci nieczynnej, który dopiero organizm — zwykle wątroba — zamienia w czynny związek. Działa z opóźnieniem i zależnie od sprawności enzymów.", t:["prolek*"] },
{ n:"Enzymy CYP", k:"Farmakologia", o:"Rodzina enzymów wątrobowych (cytochrom P450) metabolizujących leki. Inhibitor enzymu podnosi stężenie leków, które ten enzym rozkłada, albo blokuje aktywację proleku.", t:["CYP2C19","CYP3A4"] },
{ n:"Okres półtrwania", k:"Farmakologia", o:"Czas, po którym stężenie leku we krwi spada o połowę. Decyduje o tym, jak długo lek działa i jak często trzeba go powtarzać.", t:["okres półtrwania","Okres półtrwania"] },
{ n:"Dawka nasycająca", k:"Farmakologia", o:"Większa pierwsza dawka, która od razu daje lecznicze stężenie leku. Po niej stosuje się mniejsze dawki podtrzymujące.", t:["nasycając*"] },
{ n:"Inhibitory MAO", k:"Farmakologia", o:"Leki przeciwdepresyjne i przeciwparkinsonowskie hamujące monoaminooksydazę — enzym rozkładający serotoninę i noradrenalinę. Z wieloma lekami dają groźne interakcje.", t:["MAO"] },
{ n:"TLPD", k:"Skrót", o:"Trójpierścieniowe leki przeciwdepresyjne (np. amitryptylina). W zatruciu blokują kanały sodowe serca: szerokie QRS, zaburzenia rytmu, drgawki, śpiączka.", l:"Leczenie zatrucia: wodorowęglan sodu.", t:["TLPD","trójpierścieniow*"] },
{ n:"Tienopirydyna", k:"Farmakologia", o:"Grupa chemiczna leków przeciwpłytkowych, które po aktywacji w wątrobie nieodwracalnie blokują receptor P2Y12.", t:["tienopirydyn*"] },
{ n:"Fenotiazyna", k:"Farmakologia", o:"Grupa chemiczna leków blokujących receptory dopaminowe — neuroleptyki i leki przeciwwymiotne. Typowe ryzyko: objawy pozapiramidowe, senność, spadek ciśnienia.", t:["fenotiazyn*"] },
{ n:"Salicylany", k:"Farmakologia", o:"Pochodne kwasu salicylowego, podgrupa NLPZ.", t:["salicylan*"] },
{ n:"Niedobór G-6-PD", k:"Stan kliniczny", o:"Wrodzony brak enzymu chroniącego krwinki czerwone. Niektóre leki wywołują wtedy ich rozpad (hemolizę).", t:["G-6-PD"] },

// ── Drogi i sposoby podania ──
{ n:"iv (i.v.)", k:"Droga podania", o:"Dożylnie (łac. intravenosa). Lek trafia prosto do krwi — działa najszybciej i w całości.", t:["=iv","i.v."] },
{ n:"io (i.o.)", k:"Droga podania", o:"Doszpikowo (intraossea) — do jamy szpikowej kości, zwykle piszczeli. Równoważna dożylnej, gdy nie da się szybko założyć wkłucia.", t:["=io"] },
{ n:"im (i.m.)", k:"Droga podania", o:"Domięśniowo (intramuscularis) — w boczną część uda, mięsień naramienny lub pośladkowy, pod kątem 90°.", t:["=im","i.m."] },
{ n:"sc (s.c.)", k:"Droga podania", o:"Podskórnie (subcutanea) — w tkankę podskórną, pod kątem 45°. Wchłanianie wolne, a we wstrząsie niepewne.", t:["=sc","s.c."] },
{ n:"s.l.", k:"Droga podania", o:"Podjęzykowo (sublingualis). Lek wchłania się przez śluzówkę prosto do krwi z pominięciem wątroby — działa w 1–3 minuty.", t:["s.l.","podjęzykow*","pod język"] },
{ n:"po (p.o.)", k:"Droga podania", o:"Doustnie (per os). Najwolniejszy początek działania; część leku rozkłada wątroba, zanim trafi do krążenia.", t:["p.o."] },
{ n:"Nebulizacja", k:"Droga podania", o:"Podanie leku jako mgiełki wdychanej przez maskę lub ustnik. Nebulizator napędza się tlenem lub powietrzem o przepływie 6–8 l/min.", t:["nebulizacj*","nebulizator*"] },
{ n:"Bolus", k:"Sposób podania", o:"Jednorazowe podanie całej dawki dożylnie w krótkim czasie — w odróżnieniu od wlewu.", t:["bolus*"] },
{ n:"Wlew", k:"Sposób podania", o:"Podawanie leku lub płynu dożylnie przez dłuższy czas: kroplowy (grawitacyjny) albo ciągły w pompie infuzyjnej, która dawkuje z dokładnością do dziesiątych części mililitra na godzinę.", t:["wlew","wlewie","wlewu","wlewem","wlewy","w pompie"] },
{ n:"Wlewka doodbytnicza", k:"Sposób podania", o:"Gotowa mikrotubka z roztworem leku do podania przez odbyt. Wchłania się szybko i nie wymaga wkłucia.", t:["wlewk*","wlewce","mikrowlew*"] },
{ n:"Miareczkowanie", k:"Sposób podania", o:"Podawanie leku małymi porcjami z oceną efektu po każdej z nich, aż do osiągnięcia celu. Podanie frakcjami to to samo.", t:["miareczk*","frakcjami"] },

function tasuj(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function los(a, n){ return tasuj(a).slice(0, n); }
function uniq(a){ return [...new Set(a)]; }
const dzial = id => DZIALY.find(d => d.id === id);
const zaliczony = id => (stan.best[id] || 0) >= PROG;

// ═══════════ SŁOWNICZEK: wyszukiwanie haseł w tekście ═══════════
const SL_ZN = "A-Za-z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻαβµ₂";
const slEsc = s => s.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");
const SL_CS = new Map(), SL_CI = [];
SLOWNIK.forEach((e, i) => e.t.forEach(v => {
  if (v[0] === "=") SL_CS.set(v.slice(1), i);
  else if (/[A-ZĄĆĘŁŃÓŚŹŻ0-9αβµ₂.]/.test(v.slice(1)) || /^[A-Z]+$/.test(v)) SL_CS.set(v, i);
  else SL_CI.push({ s:v.replace(/\*$/, "").toLowerCase(), w:v.endsWith("*"), i });
}));
SL_CI.sort((a, b) => b.s.length - a.s.length);
const SL_RE_CS = new RegExp("(^|[^" + SL_ZN + "])(" + [...SL_CS.keys()].sort((a, b) => b.length - a.length).map(slEsc).join("|") + ")(?![" + SL_ZN + "])", "g");
const SL_RE_CI = new RegExp("(^|[^" + SL_ZN + "])(" + SL_CI.map(x => slEsc(x.s) + (x.w ? "[a-ząćęłńóśźż]*" : "")).join("|") + ")(?![" + SL_ZN + "])", "gi");
// „po” jako droga doustna: tylko po dawce („180 mg po”) lub po ukośniku („iv/po”), nigdy „po 3. defibrylacji”
const SL_RE_PO = /((?:\d m?g|mg\/d) |\/)(po)(?![A-Za-z0-9ąćęłńóśźż])(?! \d)/g;
const SL_PO = SLOWNIK.findIndex(e => e.n.startsWith("po ("));
function slZnajdz(txt){
  const hits = [];
  const zbierz = (re, id) => { re.lastIndex = 0; let m; while ((m = re.exec(txt))) { const s = m.index + m[1].length, i = id(m[2]); if (i != null && i >= 0) hits.push([s, s + m[2].length, i]); if (!m[0].length) re.lastIndex++; } };
  zbierz(SL_RE_CS, w => SL_CS.get(w));
  zbierz(SL_RE_CI, w => { const lw = w.toLowerCase(), x = SL_CI.find(x => x.w ? lw.startsWith(x.s) : lw === x.s); return x ? x.i : null; });
  zbierz(SL_RE_PO, () => SL_PO);
  return hits.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
}
// gl(tekst) — zwraca tekst z podkreślonymi hasłami (każde hasło raz na fragment)
function gl(txt){
  let out = "", poz = 0; const byly = new Set();
  for (const [s, e, i] of slZnajdz(txt)) {
    if (s < poz || byly.has(i)) continue;
    byly.add(i);
    out += txt.slice(poz, s) + `<span class="term" tabindex="0" data-g="${i}">${txt.slice(s, e)}</span>`; poz = e;
  }
  return out + txt.slice(poz);
}

const krewni = (a, b) => RODZINY.some(r => r.includes(a) && r.includes(b));

// ── generator pytań: 6 na każdy lek ──
const TYPY = [
  ["Scenka","Scenki z wyjazdu"], ["Dawka","Dawki"], ["Pułapka","Pułapki i haczyki"],
  ["Mechanizm","Mechanizmy"], ["Grupa","Grupy leków"], ["Wskazanie","Wskazania"]
];
function pytaniaLeku(l){
  const inne = LEKI.filter(x => x.n !== l.n);
  const obce = inne.filter(x => x.sek !== l.sek && !krewni(x.n, l.n));
  const swoje = inne.filter(x => x.sek === l.sek);
  const nazwy = () => [...los(swoje, 2), ...los(obce, 1)].map(x => x.n);
  return [
    { typ:"Scenka", lek:l, q:"Który lek z listy tu pasuje?", cyt:l.scen, a:l.n, d:nazwy(), w:l.kiedy + ". " + l.uw },
    { typ:"Dawka", lek:l, q:l.dq.q, a:l.dq.a, d:l.dq.d, w:l.dq.w || l.uw },
    { typ:"Pułapka", lek:l, q:l.pq.q, a:l.pq.a, d:l.pq.d, w:l.pq.w },
    { typ:"Mechanizm", lek:l, q:"Który lek działa w ten sposób?", cyt:l.mq || l.mech, a:l.n, d:nazwy(), w:l.obraz },
    { typ:"Grupa", lek:l, q:"Do jakiej grupy należy " + l.n + "?", a:l.kl, d:los(uniq(obce.map(x => x.kl)).filter(k => k !== l.kl), 3), w:l.mech },
    { typ:"Wskazanie", lek:l, q:"Kiedy sięgasz po lek: " + l.n + "?", a:l.kiedy, d:los(uniq(obce.map(x => x.kiedy)).filter(k => k !== l.kiedy), 3), w:l.obraz }
  ];
}
function pula(sekIds, typy){
  return LEKI.filter(l => sekIds.includes(l.sek)).flatMap(pytaniaLeku).filter(p => !typy || typy.includes(p.typ));
}
// losowanie z równym udziałem leków: najpierw po jednym pytaniu z każdego leku, potem kolejne
function losujTest(sekIds, typy, ile){
  const wg = {};
  tasuj(pula(sekIds, typy)).forEach(p => (wg[p.lek.n] = wg[p.lek.n] || []).push(p));
  const kolejki = tasuj(Object.values(wg)), out = [];
  while (out.length < ile && kolejki.some(k => k.length)) {
    for (const k of kolejki) { if (k.length && out.length < ile) out.push(k.pop()); }
  }
  return tasuj(out);
}

  $$(".dop-b.prawy").forEach(b => b.onclick = () => {
    const l = LEKI[+b.dataset.p]; if (P.okP.has(l.n) || !P.wyb) return;
    if (l[P.tryb] === LEKI.find(x => x.n === P.wyb)[P.tryb]) { P.ok.add(P.wyb); P.okP.add(l.n); P.wyb = null; if (P.ok.size === 5 && !P.bledy) { stan.dop[D.id] = true; zapisz(); } rysPary(); }
    else { P.bledy++; b.classList.add("zle"); setTimeout(rysPary, 380); }
  });
  if (koniec) { $("#d-raz").onclick = () => rysDopasuj(); $("#d-test").onclick = () => { zakladka = "test"; rysZakladke(); naGore(); }; }
}

// ── Test działu: ekran startowy ──
function rysTestDzialu(){
  const b = stan.best[D.id] || 0;
  $("#tresc").innerHTML = `<div class="panel">
    <h3 style="font-size:19px">Test z działu ${D.nr}</h3>
    <p class="sekc-p" style="margin-top:6px">30 pytań w puli — po 6 na każdy lek: scenka z wyjazdu, dawka, pułapka, mechanizm, grupa i wskazanie. Po każdej odpowiedzi dostajesz wyjaśnienie. Próg zaliczenia: ${PROG}%.</p>
    <div class="mini" style="font-weight:700;margin-bottom:14px">${b ? "Twój najlepszy wynik: " + b + "%" + (b >= PROG ? " — dział zaliczony ✓" : "") : "Jeszcze nie podchodziłeś do tego testu."}</div>
    <div class="rzad">
      <button class="btn" data-i="10">Szybki — 10 pytań</button>
      <button class="btn sec" data-i="20">Solidny — 20 pytań</button>
      <button class="btn sec" data-i="30">Pełny — 30 pytań</button>
    </div></div>`;
  $$("#tresc .btn").forEach(x => x.onclick = () => startTest({ sek:[D.id], ile:+x.dataset.i, tytul:"Test · dział " + D.nr, wroc:() => otworzDzial(D.id, "test"), zapisz:D.id }));
}

// ═══════════ SILNIK TESTU ═══════════
let T = null;
function startTest(m, gotowe){
  T = { m, p: gotowe || losujTest(m.sek, m.typy, m.ile), i:0, ok:0, hist:[], odp:false };
  ustawKolor(m.sek.length === 1 ? dzial(m.sek[0]).kol : null); widok = "test";
  naglowek(m.tytul, m.wroc, "✕ Przerwij");
  rysPytanie(); naGore();
}
function rysPytanie(){
  const q = T.p[T.i]; T.odp = false; T.opc = tasuj([q.a, ...q.d]);
  app.innerHTML = `
    <div class="t-gora"><span>Pytanie ${T.i + 1} z ${T.p.length}</span><span>Dobrze: ${T.ok}</span></div>
    <div class="t-pasek"><i style="width:${T.i / T.p.length * 100}%"></i></div>
    <div class="panel" style="--kol:${q.lek.kol}">
      <span class="t-typ">${q.typ} · dział ${q.lek.snr}</span>
      <div class="t-q">${gl(q.q)}</div>
      ${q.cyt ? `<div class="t-cyt">${gl(q.cyt)}</div>` : ""}
      <div class="t-odp">${T.opc.map((o, i) => `<button data-i="${i}"><span class="lit">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
      <div id="t-fb"></div>
      <button class="btn" id="t-dalej" style="width:100%;margin-top:14px" hidden>${T.i === T.p.length - 1 ? "Zobacz wynik" : "Następne pytanie →"}</button>
    </div>`;
  $$(".t-odp button").forEach(b => b.onclick = () => odpowiedz(+b.dataset.i));
  $("#t-dalej").onclick = dalej;
}
function odpowiedz(i){
  if (!T || T.odp || i >= T.opc.length) return;
  T.odp = true;
  const q = T.p[T.i], wyb = T.opc[i], ok = wyb === q.a, l = q.lek;
  if (ok) T.ok++;
  T.hist.push({ q, wyb, ok });
  $$(".t-odp button").forEach((b, k) => { b.disabled = true; if (T.opc[k] === q.a) b.classList.add("dobra"); else if (k === i) b.classList.add("zla"); });
  $("#t-fb").innerHTML = `<div class="t-fb ${ok ? "ok" : "no"}">
    <h4>${ok ? "✓ Dobrze" : "✗ Poprawna odpowiedź: " + q.a}</h4>
    <p>${gl(q.w)}</p>
    <div class="karta"><b>${l.n}</b> — ${gl(l.kl)}. Dawka kluczowa: <b>${gl(l.klucz)}</b>.</div></div>`;
  const d = $("#t-dalej"); d.hidden = false; d.focus({ preventScroll:true });
}
function dalej(){ if (!T || !T.odp) return; if (T.i === T.p.length - 1) wynikTestu(); else { T.i++; rysPytanie(); naGore(); } }
document.addEventListener("keydown", e => {
  if (!T || T.koniec || e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (!T.odp && idx >= 0) odpowiedz(idx);
  else if (T.odp && (k === "enter" || k === " " || k === "arrowright")) { e.preventDefault(); dalej(); }
});
function wynikTestu(){
  T.koniec = true; widok = "wynik";
  const n = T.p.length, proc = Math.round(T.ok / n * 100), m = T.m;
  let nowyRekord = false;
  if (m.zapisz && n >= 10 && proc > (stan.best[m.zapisz] || 0)) { stan.best[m.zapisz] = proc; zapisz(); nowyRekord = true; }
  const grupuj = f => { const g = {}; T.hist.forEach(h => { const k = f(h); g[k] = g[k] || [0, 0]; g[k][1]++; if (h.ok) g[k][0]++; }); return g; };
  const wgSek = grupuj(h => h.q.lek.snr + ". " + dzial(h.q.lek.sek).t), wgTyp = grupuj(h => h.q.typ);
  const rozb = g => Object.entries(g).map(e => `<div><span>${e[0]}</span><b style="color:${e[1][0] === e[1][1] ? "var(--ok)" : e[1][0] / e[1][1] < .6 ? "var(--zle)" : "var(--tekst)"}">${e[1][0]}/${e[1][1]}</b></div>`).join("");
  const bledy = T.hist.filter(h => !h.ok);
  const wer = proc >= PROG ? (proc === 100 ? "Bezbłędnie." : "Zaliczone.") : proc >= 60 ? "Blisko — jeszcze jedna powtórka." : "Wróć do kart i ściągi, potem spróbuj ponownie.";
  app.innerHTML = `
    <div class="panel wynik-k" style="margin-top:20px">
      <div class="proc" style="color:${proc >= PROG ? "var(--ok)" : proc >= 60 ? "var(--zolty)" : "var(--zle)"}">${proc}%</div>
      <div class="wer">${T.ok} z ${n} · ${wer}</div>
      ${nowyRekord ? `<div class="mini" style="margin-top:6px;font-weight:700">Nowy najlepszy wynik w tym dziale${proc >= PROG ? " — dział zaliczony ✓" : ""}.</div>` : ""}
      ${m.zapisz && n < 10 ? `<div class="mini" style="margin-top:6px">Powtórka błędów nie zmienia wyniku działu.</div>` : ""}
      <div class="rzad" style="justify-content:center;margin-top:18px">
        ${bledy.length ? `<button class="btn" id="w-bl">Powtórz błędne (${bledy.length})</button>` : ""}
        <button class="btn sec" id="w-raz">Nowe losowanie</button><button class="btn sec" id="w-wr">Wróć</button>
      </div>
    </div>
    ${Object.keys(wgSek).length > 1 ? `<h3 class="sekc-h" style="font-size:16px">Wynik według działów</h3><div class="rozb">${rozb(wgSek)}</div>` : ""}
    <h3 class="sekc-h" style="font-size:16px">Wynik według rodzaju pytań</h3><div class="rozb">${rozb(wgTyp)}</div>
    ${bledy.length ? `<h3 class="sekc-h" style="font-size:16px">Do poprawki</h3>` + bledy.map(h => `<div class="blad">
        <div style="font-weight:700">${h.q.q}</div>${h.q.cyt ? `<div class="mini" style="margin:3px 0">${h.q.cyt}</div>` : ""}
        <div class="tw">Twoja odpowiedź: ${h.wyb}</div><div class="pop">Poprawna: ${h.q.a}</div>
        <div class="mini" style="margin-top:4px">${gl(h.q.w)}</div></div>`).join("") : ""}`;
  naglowek(m.tytul, m.wroc, "← Wróć");
  if (bledy.length) $("#w-bl").onclick = () => startTest(Object.assign({}, m, { zapisz:null, tytul:"Powtórka błędów", oryg:m.oryg || m }), tasuj(bledy.map(h => h.q)));
  $("#w-raz").onclick = () => startTest(m.oryg || m);
  $("#w-wr").onclick = m.wroc;
  naGore();
}

// ═══════════ SŁOWNICZEK: dymek i widok ═══════════
const tt = $("#tt"); let ttPrzypiety = null;
function ttPokaz(el){
  const e = SLOWNIK[+el.dataset.g]; if (!e) return;
  const wPytaniu = el.closest(".t-q, .t-cyt");        // w treści pytania nie podpowiadamy nazwami leków
  tt.innerHTML = `<div class="tt-k">${e.k}</div><div class="tt-n">${e.n}</div><div>${e.o}</div>${e.l && !wPytaniu ? `<div class="tt-l">${e.l}</div>` : ""}`;
  tt.hidden = false;
  const r = el.getBoundingClientRect(), w = tt.offsetWidth, h = tt.offsetHeight;
  tt.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
  tt.style.top = (r.bottom + 8 + h > window.innerHeight - 8 && r.top - h - 8 > 0 ? r.top - h - 8 : r.bottom + 8) + "px";
  $$(".term.akt").forEach(x => x.classList.remove("akt")); el.classList.add("akt");
}
function ttUkryj(){ tt.hidden = true; ttPrzypiety = null; $$(".term.akt").forEach(x => x.classList.remove("akt")); }
const termZ = e => e.target && e.target.closest ? e.target.closest(".term") : null;
document.addEventListener("mouseover", e => { const t = termZ(e); if (t && !ttPrzypiety) ttPokaz(t); });
document.addEventListener("mouseout", e => { if (termZ(e) && !ttPrzypiety) ttUkryj(); });
document.addEventListener("focusin", e => { const t = termZ(e); if (t && !ttPrzypiety) ttPokaz(t); });
document.addEventListener("focusout", e => { if (termZ(e) && !ttPrzypiety) ttUkryj(); });
document.addEventListener("click", e => {
  const t = termZ(e);
  if (!t) { if (!tt.hidden) ttUkryj(); return; }
  if (ttPrzypiety === t) ttUkryj(); else { ttPokaz(t); ttPrzypiety = t; }
});
window.addEventListener("scroll", () => { if (!tt.hidden) ttUkryj(); }, { passive:true });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !tt.hidden) ttUkryj(); });

const SL_GRUPY = { "Skrót":"Skróty", "Rytm i EKG":"Rytm i EKG", "Zabieg":"Rytm i EKG", "Receptor":"Receptory i mechanizmy", "Mechanizm":"Receptory i mechanizmy", "Fizjologia":"Receptory i mechanizmy",
  "Farmakologia":"Farmakologia", "Pojęcie":"Farmakologia", "Badanie":"Farmakologia", "Droga podania":"Podawanie leków", "Sposób podania":"Podawanie leków", "Jednostka":"Podawanie leków",
  "Stan kliniczny":"Stany kliniczne", "Objaw":"Stany kliniczne", "Działanie niepożądane":"Działania niepożądane", "Powikłanie":"Działania niepożądane", "Płyny":"Płyny i elektrolity" };
let slStan = { q:"", g:"Wszystkie" };
function slownik(){
  const wroc = widok === "dzial" && D ? (id => () => otworzDzial(id, zakladka, lekIdx))(D.id) : hub;
  widok = "slownik"; T = null; ustawKolor(); naglowek("Słowniczek", wroc, "← Wróć");
  const grupy = ["Wszystkie", ...new Set(SLOWNIK.map(e => SL_GRUPY[e.k] || e.k))];
  app.innerHTML = `
    <section class="dz-hero"><span class="et" style="color:var(--akcent)">${SLOWNIK.length} haseł</span><h2>Słowniczek</h2>
      <p>Skróty i pojęcia używane w kursie. W kartach leków i pytaniach są podkreślone kropkami — najedź na nie albo dotknij, a objaśnienie pojawi się w dymku.</p></section>
    <input class="szukaj" id="sl-q" type="search" placeholder="Szukaj: VF, wlew, agonista, hiperkaliemia…" autocomplete="off" value="${slStan.q}">
    <div class="rzad" id="sl-g" style="margin-top:10px"></div>
    <div class="mini" id="sl-ile" style="margin-top:12px;font-weight:700"></div>
    <div class="sl-lista" id="sl-l"></div>`;
  const rys = () => {
    $("#sl-g").innerHTML = grupy.map(g => `<button class="chip ${slStan.g === g ? "on" : ""}" data-g="${g}">${g}</button>`).join("");
    $$("#sl-g .chip").forEach(c => c.onclick = () => { slStan.g = c.dataset.g; rys(); });
    const s = slStan.q.trim().toLowerCase();
    const wyn = SLOWNIK.filter(e => (slStan.g === "Wszystkie" || (SL_GRUPY[e.k] || e.k) === slStan.g) && (!s || (e.n + " " + e.o + " " + (e.l || "") + " " + e.t.join(" ")).toLowerCase().includes(s)))
      .sort((a, b) => a.n.localeCompare(b.n, "pl"));
    $("#sl-ile").textContent = wyn.length ? "Pokazuję " + wyn.length + " z " + SLOWNIK.length : "Nie ma takiego hasła — spróbuj innego słowa.";
    $("#sl-l").innerHTML = wyn.map(e => `<div class="sl-h"><span class="tt-k">${e.k}</span><h3>${e.n}</h3><p>${e.o}</p>${e.l ? `<div class="tt-l">${e.l}</div>` : ""}</div>`).join("");
  };
  $("#sl-q").oninput = e => { slStan.q = e.target.value; rys(); };
  rys(); naGore();
}
$("#sl-btn").onclick = slownik;

hub();

</script>

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
